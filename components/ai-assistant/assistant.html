<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assistente IA - Blog Secreto</title>
    <link rel="stylesheet" href="./css/assistant.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f8f9fa;
            background: #080808;
        }

        .assistant-demo {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        .assistant-demo h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 6vw, 44px);
        }

        .assistant-demo p {
            margin: 0;
            color: #a7a7a7;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="assistant-demo">
        <h1>Assistente IA</h1>
        <p>Componente standalone do Blog Secreto. Use o botão fixo para abrir o chat.</p>
    </main>

    <script type="module" src="./js/core/ChatManager.js"></script>
</body>
</html>
