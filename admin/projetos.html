<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - Admin Secreto</title>
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('secreto_theme') || 'dark');
    </script>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="../components/ai-assistant/css/assistant.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="js/auth.js"></script>
    <script>Auth.checkGuard();</script>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="ph-fill ph-hexagon"></i> Admin Secreto
        </div>
        <ul class="sidebar-nav">
            <li><a href="index.html"><i class="ph ph-squares-four"></i> Visão Geral</a></li>
            <li><a href="projetos.html" class="active"><i class="ph ph-folder-notch"></i> Projetos</a></li>
            <li><a href="configuracoes.html"><i class="ph ph-gear"></i> Configurações</a></li>
            <li style="margin-top: auto;"><a href="login.html" onclick="Auth.logout(event)"><i class="ph ph-sign-out"></i> Desconectar</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="mobile-menu-btn" class="btn-icon" type="button"><i class="ph ph-list"></i></button>
                <h2>Gerenciar Projetos</h2>
            </div>
            <div class="topbar-actions">
                <button class="btn-icon" id="theme-toggle-btn" type="button" title="Alternar Tema"><i class="ph ph-sun"></i></button>
                <button class="btn btn-primary" id="btn-novo-projeto" type="button">+ Novo Projeto</button>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="card-panel" style="margin-bottom: 24px; padding: 16px;">
                <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                    <input type="text" id="input-busca" class="form-control" placeholder="Buscar por nome ou tecnologia..." style="flex: 1; min-width: 200px;">
                    <select id="filtro-status" class="form-control" style="width: auto; min-width: 160px;">
                        <option value="todos">Todos os Status</option>
                        <option value="Ativo">Ativo</option>
                        <option value="Em Teste">Em Teste</option>
                        <option value="Arquivado">Arquivado</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Projeto</th>
                        <th>Status</th>
                        <th>Versão</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody id="tabela-projetos"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="modal-projeto">
    <div class="modal-content">
        <h3 id="modal-titulo" style="margin-bottom: 20px;">Novo Projeto</h3>
        <form id="form-projeto">
            <div class="form-group">
                <label>Nome do Projeto</label>
                <input type="text" class="form-control" id="proj-nome" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>Versão</label>
                    <input type="text" class="form-control" id="proj-versao" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="proj-status" class="form-control">
                        <option value="Ativo">Ativo</option>
                        <option value="Em Teste">Em Teste</option>
                        <option value="Arquivado">Arquivado</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Tecnologias (separadas por vírgula)</label>
                <input type="text" class="form-control" id="proj-tech" placeholder="React, Node.js">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="proj-desc" class="form-control" required></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>URL Imagem</label>
                    <input type="url" class="form-control" id="proj-imagem" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Link do Projeto</label>
                    <input type="text" class="form-control" id="proj-link" placeholder="#">
                </div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end;">
                <button type="button" class="btn btn-outline" id="btn-cancelar-projeto">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar Registro</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="modal-confirmar-exclusao">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <h3 style="color: var(--danger); margin-bottom: 12px;">Confirmar Exclusão</h3>
        <p class="text-muted" style="margin-bottom: 24px;">Tem certeza que deseja apagar este projeto do banco de dados?</p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <button class="btn btn-outline" id="btn-cancelar-exclusao" type="button">Cancelar</button>
            <button class="btn btn-danger" id="btn-confirmar-exclusao" type="button">Sim, Excluir</button>
        </div>
    </div>
</div>

<script type="module" src="../firebase/firebase.js"></script>
<script type="module" src="./js/firebase-store.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/projetos.js"></script>
<script type="module" src="../components/ai-assistant/js/core/ChatManager.js"></script>
</body>
</html>
