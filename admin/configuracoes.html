<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Admin Secreto</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="../components/ai-assistant/css/assistant.css">
    <script src="js/auth.js"></script>
    <script>Auth.checkGuard();</script>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span style="color: var(--primary);">●</span> Admin Secreto
        </div>
        <ul class="sidebar-nav">
            <li><a href="index.html">Visão Geral</a></li>
            <li><a href="projetos.html">Projetos</a></li>
            <li><a href="configuracoes.html" class="active">Configurações</a></li>
            <li style="margin-top: auto;"><a href="login.html">Desconectar</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h2>Configurações do Sistema</h2>
        </header>

        <div class="content-wrapper">
            <div class="table-container" style="padding: 32px; max-width: 600px;">
                <form style="display: flex; flex-direction: column; gap: 24px;">
                    <div>
                        <label class="text-muted" style="display: block; margin-bottom: 8px;">Nome do Diretório (Site)</label>
                        <input type="text" value="Blog Secreto" style="width: 100%; padding: 12px; background: var(--bg-panel); border: 1px solid var(--border); color: #fff; border-radius: 4px;">
                    </div>
                    <div>
                        <label class="text-muted" style="display: block; margin-bottom: 8px;">Idioma Base</label>
                        <select style="width: 100%; padding: 12px; background: var(--bg-panel); border: 1px solid var(--border); color: #fff; border-radius: 4px;">
                            <option>Português (Brasil)</option>
                            <option>English (US)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-muted" style="display: block; margin-bottom: 8px;">Tema do Admin</label>
                        <div style="display: flex; gap: 16px;">
                            <label><input type="radio" name="theme" checked> Dark Mode Clássico</label>
                            <label><input type="radio" name="theme" disabled> Terminal (Breve)</label>
                        </div>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border);">
                    <button type="button" class="btn btn-primary" style="align-self: flex-start;">Salvar Preferências</button>
                </form>
            </div>
        </div>
    </main>
</div>
<script type="module" src="../components/ai-assistant/js/core/ChatManager.js"></script>
</body>
</html>
