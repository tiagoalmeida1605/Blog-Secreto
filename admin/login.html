<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Secreto</title>
    <script>
        const theme = localStorage.getItem('secreto_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <div class="login-header">
            <i class="ph ph-fingerprint"></i>
            <h1>Admin Secreto</h1>
            <p class="text-muted">Acesso restrito à central de comando.</p>
        </div>
        <form id="form-login">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" class="form-control" id="login-user" placeholder="admin" required autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom: 32px;">
                <label>Chave de Segurança</label>
                <input type="password" class="form-control" id="login-pass" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                Autenticar <i class="ph ph-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('login-user').value;
        const p = document.getElementById('login-pass').value;

        // O botão vira loading visualmente
        const btn = this.querySelector('button');
        btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Processando...';
        btn.disabled = true;

        setTimeout(() => { // Simula leve delay para UX premium
            if (Auth.login(u, p)) {
                window.location.href = 'index.html';
            } else {
                alert('Credenciais Inválidas! Acesso negado.');
                btn.innerHTML = 'Autenticar <i class="ph ph-arrow-right"></i>';
                btn.disabled = false;
            }
        }, 600);
    });
</script>
</body>
</html>
