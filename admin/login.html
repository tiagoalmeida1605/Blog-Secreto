<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Secreto</title>
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('secreto_theme') || 'dark');
    </script>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .login-wrapper {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; width: 100%; background: var(--bg-base);
        }
        .login-box {
            background: var(--bg-surface); border: 1px solid var(--border);
            padding: 40px; border-radius: var(--radius-md); width: 100%; max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-header i { font-size: 2.8rem; color: var(--primary); margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <div class="login-header">
            <i class="ph-fill ph-hexagon"></i>
            <h2>Blog Secreto</h2>
            <p class="text-muted">Acesso Restrito ao Painel</p>
        </div>
        <form id="form-login">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="login-user" class="form-control" placeholder="admin" required>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Chave de Segurança</label>
                <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Autenticar</button>
        </form>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('login-user').value;
        const p = document.getElementById('login-pass').value;

        if (Auth.login(u, p)) {
            window.location.href = 'index.html';
        } else {
            alert('Credenciais Inválidas! Acesso negado.');
        }
    });
</script>
</body>
</html>
