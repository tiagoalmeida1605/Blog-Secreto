<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Secreto</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .login-wrapper {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; width: 100%; background: var(--bg-dark);
        }
        .login-box {
            background: var(--bg-panel); border: 1px solid var(--border);
            padding: 48px; border-radius: var(--radius); width: 100%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { color: var(--accent); margin-bottom: 8px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; color: var(--text-muted); }
        .form-group input {
            padding: 12px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); color: var(--text-main); font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .form-options { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 24px; }
        .form-options a { color: var(--text-muted); text-decoration: none; }
        .form-options a:hover { color: var(--accent); }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <div class="login-header">
            <h1>Blog Secreto</h1>
            <p class="text-muted">Acesso Restrito ao Sistema</p>
        </div>
        <form action="index.html" method="GET">
            <div class="form-group">
                <label>Usuário de Acesso</label>
                <input type="text" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Chave de Segurança</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Lembrar credenciais</label>
                <a href="#">Esqueci a chave</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Autenticar</button>
        </form>
    </div>
</div>
</body>
</html>
