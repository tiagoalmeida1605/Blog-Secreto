<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin Secreto</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="../components/ai-assistant/css/assistant.css">
  <script src="js/auth.js"></script>
  <script>Auth.checkGuard();</script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span style="color: var(--primary);">●</span> Admin Secreto
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html" class="active">Visão Geral</a></li>
      <li><a href="projetos.html">Projetos</a></li>
      <li><a href="configuracoes.html">Configurações</a></li>
      <li style="margin-top: auto;"><a href="login.html">Desconectar</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h2>Dashboard</h2>
      <div class="user-profile">Agente 01</div>
    </header>

    <div class="content-wrapper">
      <div class="grid-cards">
        <div class="stat-card">
          <p class="text-muted">Projetos Ativos</p>
          <h3>12</h3>
        </div>
        <div class="stat-card">
          <p class="text-muted">Última Atualização</p>
          <h3>Hoje, 10:42</h3>
        </div>
        <div class="stat-card">
          <p class="text-muted">Versão do Sistema</p>
          <h3>v0.1-alpha</h3>
        </div>
        <div class="stat-card">
          <p class="text-muted">Status do Servidor</p>
          <h3 style="color: #2ecc71;">Operacional</h3>
        </div>
      </div>

      <div class="table-container" style="padding: 24px;">
        <h3 style="margin-bottom: 16px;">Ações Rápidas</h3>
        <div style="display: flex; gap: 12px;">
          <button class="btn btn-primary" onclick="window.location.href='projetos.html'">+ Novo Projeto</button>
          <button class="btn btn-outline">Forçar Backup</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script>
  // Lógica simples direto na view do Dashboard para popular os cards
  document.addEventListener('DOMContentLoaded', () => {
    const stats = Store.getStats();
    const cards = document.querySelectorAll('.stat-card h3');
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');

    if(cards.length >= 2) {
      cards[0].textContent = stats.ativos;
      cards[1].textContent = `Hoje, ${hours}:${minutes}`;
    }
  }, { once: true });
</script>
<script type="module" src="../components/ai-assistant/js/core/ChatManager.js"></script>
</body>
</html>
