<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin Secreto</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('secreto_theme') || 'dark');
  </script>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="../components/ai-assistant/css/assistant.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
<script type="module" src="js/auth.js"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <i class="ph-fill ph-hexagon"></i> Admin Secreto
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html" class="active"><i class="ph ph-squares-four"></i> Visão Geral</a></li>
      <li><a href="projetos.html"><i class="ph ph-folder-notch"></i> Projetos</a></li>
      <li><a href="tags.html"><i class="ph ph-tag"></i> Tags</a></li>
      <li><a href="configuracoes.html"><i class="ph ph-gear"></i> Configurações</a></li>
      <li style="margin-top: auto;"><a href="login.html" onclick="Auth.logout(event)"><i class="ph ph-sign-out"></i> Desconectar</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="mobile-menu-btn" class="btn-icon" type="button"><i class="ph ph-list"></i></button>
        <h2>Dashboard</h2>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" id="theme-toggle-btn" type="button" title="Alternar Tema"><i class="ph ph-sun"></i></button>
        <div class="user-profile">Agente 01</div>
      </div>
    </header>

    <div class="content-wrapper">
      <div class="grid-cards">
        <div class="stat-card">
          <p class="text-muted">Projetos Ativos</p>
          <h3 id="stat-ativos">0</h3>
        </div>
        <div class="stat-card">
          <p class="text-muted">Projetos em Teste</p>
          <h3 id="stat-teste">0</h3>
        </div>
        <div class="stat-card">
          <p class="text-muted">Última Atualização</p>
          <h3 id="stat-time">--:--</h3>
        </div>
        <div class="stat-card">
          <p class="text-muted">Status do Servidor</p>
          <h3 style="color: var(--success);">Operacional</h3>
        </div>
      </div>

      <div class="card-panel">
        <h3 style="margin-bottom: 16px;">Ações Rápidas</h3>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <button class="btn btn-primary" type="button" onclick="window.location.href='projetos.html'">+ Novo Projeto</button>
          <button class="btn btn-outline" type="button" onclick="UI.showAlert('Backup do sistema gerado com sucesso!')">Forçar Backup</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="../firebase/firebase.js"></script>
<script type="module" src="js/services/projetoService.js"></script>
<script src="js/components.js"></script>
<script type="module" src="../components/ai-assistant/js/core/ChatManager.js"></script>
<script type="module">
  import { ProjetoService } from './js/services/projetoService.js';

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const projetos = await ProjetoService.getProjetos();

      const normalizeStatus = (valor) => String(valor || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .trim();

      const ativos = projetos.filter((p) => normalizeStatus(p.status) === 'ativo' || !p.status).length;
      const emTeste = projetos.filter((p) => normalizeStatus(p.status) === 'em teste').length;

      document.getElementById('stat-ativos').textContent = ativos;
      document.getElementById('stat-teste').textContent = emTeste;
    } catch (erro) {
      console.error('Erro ao carregar estatísticas do Firestore:', erro);
      document.getElementById('stat-ativos').textContent = '-';
      document.getElementById('stat-teste').textContent = '-';
    }

    const now = new Date();
    document.getElementById('stat-time').textContent = `Hoje, ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  });
</script>
</body>
</html>
