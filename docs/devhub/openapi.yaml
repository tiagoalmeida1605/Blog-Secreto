openapi: 3.1.0
info:
  title: NEXUS Dev Hub API
  version: "2.0.0"
  description: API do workspace privado NEXUS Dev Hub. Rotas privadas exigem um Firebase ID Token do proprietário.
servers:
  - url: /
paths:
  /api/devhub/v1/health:
    get:
      summary: Verifica se a API está ativa
      description: Endpoint público de liveness; não consulta Firebase ou integrações externas.
      security: []
      responses:
        "200":
          description: API ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/devhub/v1/services:
    $ref: "#/components/pathItems/PrivateGet"
  /api/devhub/v1/github:
    $ref: "#/components/pathItems/PrivateGet"
  /api/devhub/v1/deployments:
    $ref: "#/components/pathItems/PrivateGet"
  /api/devhub/v1/overview:
    $ref: "#/components/pathItems/PrivateGet"
  /api/devhub/v1/projects:
    get:
      $ref: "#/components/pathItems/PrivateGet/get"
    post:
      summary: Cria um projeto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateInput"
      responses:
        "200":
          $ref: "#/components/responses/PrivateSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/devhub/v1/projects/{projectId}:
    patch:
      summary: Atualiza um projeto
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          $ref: "#/components/responses/PrivateSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/devhub/v1/settings:
    get:
      $ref: "#/components/pathItems/PrivateGet/get"
    put:
      summary: Atualiza preferências do workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          $ref: "#/components/responses/PrivateSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/devhub/v1/analytics:
    get:
      summary: Lê snapshots históricos
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        "200":
          $ref: "#/components/responses/PrivateSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      summary: Coleta um snapshot atual
      description: O endpoint coleta métricas no servidor e rejeita dados enviados pelo navegador. Não há agendamento automático configurado.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/PrivateSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/devhub/v1/rga-feed:
    $ref: "#/components/pathItems/PrivateGet"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
  pathItems:
    PrivateGet:
      get:
        summary: Consulta dados privados
        security:
          - bearerAuth: []
        responses:
          "200":
            $ref: "#/components/responses/PrivateSuccess"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "429":
            $ref: "#/components/responses/RateLimited"
          "500":
            $ref: "#/components/responses/InternalError"
          "502":
            $ref: "#/components/responses/BadGateway"
          "503":
            $ref: "#/components/responses/Unavailable"
          "504":
            $ref: "#/components/responses/Timeout"
  responses:
    PrivateSuccess:
      description: Operação concluída; respostas privadas usam Cache-Control private, no-store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Success"
    Unauthorized:
      description: Token ausente, inválido, expirado ou revogado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: UID autenticado não é o proprietário.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Método HTTP não permitido pelo endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Parâmetros ou dados de entrada inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Projeto não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Limite de requisições informado por uma integração.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Erro interno sem detalhes técnicos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Integração respondeu com erro ou conteúdo inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Configuração ou dependência indisponível.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Timeout:
      description: Dependência não respondeu dentro do timeout configurado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Success:
      type: object
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          required: [apiVersion, requestId, generatedAt]
          properties:
            apiVersion:
              type: string
              const: v1
            requestId:
              type: string
              format: uuid
            generatedAt:
              type: string
              format: date-time
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        category:
          type: string
          minLength: 1
          maxLength: 60
        status:
          type: string
          enum: [active, planned, paused, archived]
        repository:
          type: string
        productionUrl:
          type: string
          format: uri
        technologies:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
    ProjectCreateInput:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [name]
    SettingsInput:
      type: object
      additionalProperties: false
      required: [dashboardWidgets, visibleIntegrations]
      properties:
        dashboardWidgets:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [integrations, projects, github, deployments, rga]
        visibleIntegrations:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [github, vercel, rga, firebase]
    Error:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
